<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>استودیوی فیلم‌سازی</title>
<style>
body{background:#10131b;color:white;font-family:tahoma;padding:20px}
main{max-width:700px;margin:auto}
textarea,input{width:100%;padding:14px;box-sizing:border-box;margin:10px 0;background:#20283a;color:white;border:1px solid #667;border-radius:10px}
textarea{height:150px}
button{padding:14px;background:#6878ff;color:white;border:0;border-radius:10px}
section{background:#20283a;padding:15px;margin-top:20px;border-radius:12px;white-space:pre-wrap;line-height:2}
</style>
</head>
<body>
<main>
<h1>🎬 استودیوی فیلم‌سازی من</h1>
<p>داستانت را وارد کن تا به صحنه‌های سینمایی تبدیل شود.</p>
<textarea id="story" placeholder="داستان فیلم را بنویس..."></textarea>
<input id="style" placeholder="سبک فیلم: ترسناک، اکشن، عاشقانه...">
<button onclick="makeFilm()">ساخت صحنه‌ها</button>
<section id="result">خروجی فیلم اینجا نمایش داده می‌شود.</section>
</main>
<script>
function makeFilm(){
let s=document.getElementById('story').value.trim();
let style=document.getElementById('style').value||'سینمایی';
if(!s){document.getElementById('result').innerText='اول داستان را وارد کن';return;}
let parts=s.split(/[.!؟\n]+/).filter(x=>x.trim());
document.getElementById('result').innerText=parts.map((x,i)=>
'صحنه '+(i+1)+'\n'+x+'\nپرامپت: '+x+'، سبک '+style+'، حرکت طبیعی دوربین، نورپردازی سینمایی.'
).join('\n\n----------------\n\n');
}
</script>
</body>
</html>
